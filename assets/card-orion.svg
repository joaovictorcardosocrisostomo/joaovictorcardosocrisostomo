<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" viewBox="0 0 620 230" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace">
<style>
    
    .bar{animation:bar 3s ease-in-out infinite}
    @keyframes bar{0%,100%{transform:scaleX(.15)}50%{transform:scaleX(1)}}
    .orb{animation:orb 6s ease-in-out infinite alternate}
    @keyframes orb{to{transform:translate(-30px,20px)}}
    .arrow{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{50%{transform:translateX(6px)}}
    @keyframes fall{from{transform:translateY(var(--s))}to{transform:translateY(var(--h))}}.rain{animation-name:fall;animation-iteration-count:infinite}</style>
<defs><clipPath id="c"><rect width="620" height="230" rx="14"/></clipPath>
<radialGradient id="soft"><stop offset=".35" stop-color="#D71F2D"/><stop offset="1" stop-color="#D71F2D" stop-opacity="0"/></radialGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#1d1b1b"/><stop offset=".7" stop-color="#050505"/></linearGradient></defs>
<g clip-path="url(#c)">
<rect width="620" height="230" fill="url(#g)"/>
<circle class="orb" cx="600" cy="30" r="90" fill="url(#soft)" opacity=".55"/>
<g>
<text x="28" y="52" font-size="15" fill="#D71F2D">~/projetos/Orion-py</text>
<text x="28" y="94" font-size="34" font-weight="700" fill="white">Orion</text>
<text x="28" y="128" font-size="16" fill="#cfcfcf">Bot em Python com API, banco de dados</text>
<text x="28" y="150" font-size="16" fill="#cfcfcf">e deploy com Docker.</text>
<rect x="28" y="172" width="76" height="28" rx="14" fill="none" stroke="#D71F2D"/><text x="66.0" y="191" font-size="14" text-anchor="middle" fill="#eee">Python</text><rect x="114" y="172" width="49" height="28" rx="14" fill="none" stroke="#D71F2D"/><text x="138.5" y="191" font-size="14" text-anchor="middle" fill="#eee">API</text><rect x="173" y="172" width="76" height="28" rx="14" fill="none" stroke="#D71F2D"/><text x="211.0" y="191" font-size="14" text-anchor="middle" fill="#eee">Docker</text>
<g class="arrow"><text x="590" y="194" font-size="16" text-anchor="end" fill="white">ver repo →</text></g>
</g>
<rect class="bar" x="0" y="225" width="620" height="5" fill="#D71F2D" style="transform-origin:0 0"/>
</g>
<rect x="1" y="1" width="618" height="228" rx="14" fill="none" stroke="#2a2a2a" stroke-width="2"/>
</svg>