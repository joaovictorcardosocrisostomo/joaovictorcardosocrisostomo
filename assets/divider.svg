<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="40" viewBox="0 0 1280 40">
<style>
.run{animation:run 4s ease-in-out infinite alternate}
@keyframes run{to{transform:translateX(1200px)}}
.l{stroke-dasharray:6 10;animation:dash 1.5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
</style>
<defs><filter id="b" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<line class="l" x1="20" y1="20" x2="1260" y2="20" stroke="#D71F2D" stroke-opacity=".6" stroke-width="2"/>
<g class="run"><circle cx="40" cy="20" r="9" fill="#D71F2D" filter="url(#b)"/><circle cx="40" cy="20" r="5" fill="white"/></g>
</svg>